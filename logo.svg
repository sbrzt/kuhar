<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Kuhar: an egg sautéing in a pan</title>
  <style>
    .egg { transform-origin: 27px 27px; animation: wobble 1.4s ease-in-out infinite alternate; }
    .sizzle { animation: sizzle 1.2s linear infinite; }
    .b { animation-delay: .4s; }
    .c { animation-delay: .8s; }
    @keyframes wobble { to { transform: scale(1.05, .96) rotate(4deg); } }
    @keyframes sizzle { 0% { opacity: 0; transform: translateY(0); } 30% { opacity: .9; } 100% { opacity: 0; transform: translateY(-5px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <path d="M42 42 59 59" stroke="#8a5a34" stroke-width="8" stroke-linecap="round"/>
  <circle cx="27" cy="27" r="25" fill="#2b2623"/>
  <circle cx="27" cy="27" r="20.5" fill="#4a403a"/>
  <g class="egg">
    <path d="M27 12c6-1 9 4 13 7s5 9 1 13-4 9-11 10-11-2-14-7-6-9-3-15 8-7 14-8z" fill="#fffdf6"/>
    <circle cx="28" cy="27" r="6.5" fill="#f5a524"/>
    <circle cx="26" cy="25" r="1.8" fill="#ffd98a"/>
  </g>
  <g fill="#fffdf6">
    <circle class="sizzle" cx="11" cy="33" r="1.3"/>
    <circle class="sizzle b" cx="41" cy="13" r="1.1"/>
    <circle class="sizzle c" cx="43" cy="37" r="1.3"/>
  </g>
</svg>
